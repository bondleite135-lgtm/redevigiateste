<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REDE VIGIA</title>
    <meta name="description" content="Aplicativo de denúncias georreferenciadas anônimas em tempo real para smartphones Android com Google Maps e Firestore." />
    <meta property="og:title" content="REDE VIGIA" />
    <meta property="og:description" content="Aplicativo de denúncias georreferenciadas anônimas em tempo real para smartphones Android com Google Maps e Firestore." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Suppress Vite HMR WebSocket connection errors in sandbox/iframe environment
      window.addEventListener('error', function (event) {
        if (
          event.message &&
          (event.message.includes('WebSocket') ||
            event.message.includes('createWebSocketModuleRunnerTransport') ||
            event.message.includes('@vite/client'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event.reason &&
          (String(event.reason).includes('WebSocket') ||
            String(event.reason).includes('createWebSocketModuleRunnerTransport') ||
            String(event.reason).includes('@vite/client'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
