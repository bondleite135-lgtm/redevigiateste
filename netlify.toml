[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Encaminha chamadas de API para a função serverless do Netlify
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Redirecionamento SPA para que rotas cliente carreguem index.html sem erro 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
